name: Nightly load test

# docs/SECURITY_AND_PERFORMANCE_PLAYBOOK.md section 5/7: k6 script simulating
# ~7,000 sessions against a real deployment, p95 < 500ms. This needs a
# reachable staging URL and a pool of pre-issued bearer tokens (see
# frontend/scripts/loadtest_school_day.js's auth note — ThunderID's browser
# PKCE flow can't be driven by k6 directly), neither of which exist in this
# repo, so the job no-ops until LOAD_TEST_BASE_URL and LOAD_TEST_TOKENS
# (a JSON array of tokens) are configured as repo secrets.
on:
  schedule:
    - cron: "0 20 * * *" # 20:00 UTC nightly
  workflow_dispatch: {}

# Least privilege: this job runs a third-party action (grafana/k6-action)
# alongside a checked-out GITHUB_TOKEN, and needs no write access of any kind.
permissions:
  contents: read

jobs:
  k6:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/scripts
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check load test is configured
        id: config
        run: |
          if [ -z "${{ secrets.LOAD_TEST_BASE_URL }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "LOAD_TEST_BASE_URL secret is not set — skipping. See frontend/scripts/loadtest_school_day.js for what's needed."
          elif ! echo '${{ secrets.LOAD_TEST_TOKENS }}' | jq -e 'type == "array" and length > 0' > /dev/null 2>&1; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "LOAD_TEST_TOKENS secret is not a non-empty JSON array — skipping. See frontend/scripts/loadtest_school_day.js for what's needed."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Write token pool
        if: steps.config.outputs.configured == 'true'
        run: printf '%s' '${{ secrets.LOAD_TEST_TOKENS }}' > TOKENS.json

      - name: Run k6
        if: steps.config.outputs.configured == 'true'
        # Pinned by commit SHA, not the mutable v0.3.1 tag: this action reads
        # the token pool written above, so a retagged upstream release could
        # otherwise exfiltrate it. (grafana/k6-action is archived upstream —
        # re-evaluate against a maintained action if this needs to change.)
        uses: grafana/k6-action@e4714b734f2b0afaabeb7b4a69142745548ab9ec # v0.3.1
        with:
          filename: frontend/scripts/loadtest_school_day.js
        env:
          BASE_URL: ${{ secrets.LOAD_TEST_BASE_URL }}
