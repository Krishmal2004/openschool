name: Frontend CI

on:
  push:
    branches: [main, development]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

  pull_request:
    branches: [main, development]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Bundle size budget
        # Informational only for now: trimming Carbon to per-component @use
        # imports (shared/styles/index.scss) got CSS from ~874 KB to ~616
        # KB, still over the 400 KB budget — ui-shell and data-table (both
        # genuinely used everywhere) account for most of what's left.
        # Drop --warn-only once/if that's trimmed further
        # (docs/SECURITY_AND_PERFORMANCE_PLAYBOOK.md section 5).
        run: node scripts/check-bundle-size.mjs --warn-only

      - name: Dependency audit
        # Blocking. dompurify is pinned via pnpm-workspace.yaml overrides until @thunderid/react updates.
        run: pnpm audit --prod
