# Serves the built SPA inside the frontend Docker image. This is the
# container's own static-file server; deploy/nginx.conf.example (repo root)
# is the reference for the actual internet-facing reverse proxy in front of
# both this container and the backend (TLS, security headers, CSP,
# X-Forwarded-For) — adapt those rules in front of this image, don't rely on
# this file alone in production.
server {
    listen 8080;
    server_name _;

    gzip on;
    gzip_types text/css application/javascript application/json;

    root /usr/share/nginx/html;

    location = /healthz {
        return 200 "ok";
        add_header Content-Type text/plain always;
    }

    location ~* \.(js|css|woff2|png|webp|svg)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
